<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 07 · Swatch Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #efece4;
      --card: #fbfaf6;
      --ink: #1d1b18;
      --muted: #77716a;
      --line: #d9d4c8;
      --accent: #1d1b18;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--mono); min-height: 100vh; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 22px 28px 10px; flex-wrap: wrap; }
    header h1 { font: 400 44px/1 var(--serif); margin: 0; letter-spacing: -0.01em; }
    header h1 em { color: var(--muted); }
    header p { margin: 0; color: var(--muted); font-size: 13px; max-width: 46ch; }

    .btn { border: 1px solid var(--ink); background: transparent; padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
    .btn:hover { background: var(--ink); color: var(--card); }
    .btn.solid { background: var(--ink); color: var(--card); }
    .btn.solid:hover { opacity: .85; }
    .btn:disabled { opacity: .35; pointer-events: none; }

    /* empty state */
    #drop { margin: 24px 28px; border: 1.5px dashed #b9b2a4; border-radius: 18px; min-height: 62vh; display: grid; place-items: center; text-align: center; padding: 32px; transition: background .15s; }
    #drop h2 { font: italic 400 clamp(34px, 6vw, 64px)/1.05 var(--serif); margin: 0 0 12px; }
    #drop p { color: var(--muted); margin: 0 0 22px; }
    .demo-chips { display: flex; justify-content: center; gap: 6px; margin-bottom: 26px; }
    .demo-chips span { width: 34px; height: 54px; border-radius: 3px; }
    body.dragging #drop, body.dragging main { background: rgba(0,0,0,.04); }

    /* editor */
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding: 14px 28px 28px; align-items: start; }
    .stage { display: grid; place-items: center; position: relative; min-height: 60vh; }
    #card { display: block; max-width: 100%; max-height: calc(100vh - 150px); height: auto; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 40px -12px rgba(0,0,0,.25); border-radius: 4px; background: var(--card); }
    #card.over-photo { cursor: crosshair; }
    #card.over-band { cursor: pointer; }
    #loupe { position: fixed; pointer-events: none; width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); transform: translate(14px, -64px); display: none; }
    #loupe b { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 6px); background: var(--ink); color: #fff; font: 500 11px var(--mono); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

    aside { background: var(--card); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 14px; }
    aside label.title { display: block; }
    .field-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
    #title { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; font: 400 30px/1.2 var(--serif); padding: 2px 0 6px; outline: none; }
    #title:focus { border-color: var(--ink); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; }
    .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 12px; }
    .seg button.on { background: var(--ink); color: var(--card); }
    .count { display: flex; align-items: center; gap: 10px; }
    .count input { flex: 1; accent-color: var(--ink); }
    .count output { width: 2ch; text-align: right; }

    .hint { font-size: 12px; color: var(--muted); margin: 0; min-height: 3em; }
    .hint strong { color: var(--ink); font-weight: 500; }

    #colors { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #colors li { display: grid; grid-template-columns: 34px 1fr 78px 22px; gap: 8px; align-items: center; padding: 4px; border-radius: 8px; }
    #colors li.sel { background: var(--paper); }
    #colors .chip { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); padding: 0; }
    #colors input { border: 0; background: transparent; min-width: 0; padding: 4px 2px; outline: none; border-bottom: 1px solid transparent; font-size: 13px; }
    #colors input:focus { border-color: var(--ink); }
    #colors input.hex { text-transform: uppercase; color: var(--muted); }
    #colors .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0; }
    #colors .x:hover { color: var(--ink); }

    /* shelf */
    #shelf-wrap { padding: 0 28px 40px; }
    #shelf-wrap h3 { font: italic 400 26px var(--serif); margin: 10px 0 12px; }
    #shelf { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; }
    .thumb { position: relative; flex: none; border: 0; padding: 0; background: none; border-radius: 4px; outline-offset: 4px; }
    .thumb canvas { display: block; height: 150px; width: auto; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 6px 16px -8px rgba(0,0,0,.3); }
    .thumb.on { outline: 2px solid var(--ink); }
    .thumb .del { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 13px; line-height: 22px; display: none; }
    .thumb:hover .del, .thumb:focus-within .del { display: block; }
    .add-thumb { flex: none; height: 150px; width: 100px; border: 1.5px dashed #b9b2a4; border-radius: 4px; background: none; color: var(--muted); font-size: 12px; }
    .add-thumb:hover { color: var(--ink); border-color: var(--ink); }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
    #toast.show { opacity: 1; transform: translateX(-50%); }

    [hidden] { display: none !important; }

    @media (max-width: 860px) {
      header { padding: 18px 16px 8px; }
      header h1 { font-size: 36px; }
      main { grid-template-columns: 1fr; padding: 10px 16px 20px; gap: 18px; }
      .stage { min-height: 0; }
      #card { max-height: 70vh; }
      aside { position: static; }
      #drop { margin: 16px; min-height: 55vh; }
      #drop h2 br { display: none; }
      #shelf-wrap { padding: 0 16px 32px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Swatch Card <em>· day 07</em></h1>
    <p>For the photos you only took because of the colours. Upload one and it becomes a paint-chip card.</p>
  </header>

  <section id="drop">
    <div>
      <div class="demo-chips" aria-hidden="true">
        <span style="background:#e9d8b8"></span><span style="background:#d98a5f"></span><span style="background:#8a9a6b"></span><span style="background:#3f5b6e"></span><span style="background:#2a2420"></span>
      </div>
      <h2>Drop the photos you took<br>for the colours.</h2>
      <p>Or paste one. Nothing leaves your browser.</p>
      <button class="btn solid" data-upload>Choose photos</button>
    </div>
  </section>

  <main hidden>
    <div class="stage">
      <canvas id="card" width="1200" height="1800"></canvas>
    </div>
    <aside>
      <label class="title">
        <span class="field-label">Card name</span>
        <input id="title" placeholder="Name this card" maxlength="40">
      </label>

      <div>
        <span class="field-label">Layout</span>
        <div class="row">
          <div class="seg" id="layout">
            <button data-layout="portrait">Tall</button>
            <button data-layout="landscape">Wide</button>
            <button data-layout="chips">Chips only</button>
          </div>
        </div>
      </div>

      <div>
        <span class="field-label">How many colours</span>
        <div class="count">
          <input type="range" id="count" min="2" max="9" step="1" value="5">
          <output id="countOut">5</output>
          <button class="btn" id="shuffle" title="Try a different set of colours">Shuffle</button>
        </div>
      </div>

      <p class="hint" id="hint"></p>

      <ul id="colors"></ul>

      <div class="row">
        <button class="btn solid" id="download">Download PNG</button>
        <button class="btn" data-upload>Add photos</button>
      </div>
    </aside>
  </main>

  <section id="shelf-wrap" hidden>
    <h3>Your cards</h3>
    <div id="shelf"></div>
  </section>

  <input type="file" id="file" accept="image/*" multiple hidden>
  <div id="loupe"><b></b></div>
  <div id="toast"></div>

<script>
// ---------- colour maths ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const toHex = ([r, g, b]) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const fromHex = h => { h = h.replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

function rgb2lab([r, g, b]) {
  const f = c => (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
  r = f(r); g = f(g); b = f(b);
  let x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
  let y = (r * 0.2126 + g * 0.7152 + b * 0.0722);
  let z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
  const k = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  x = k(x); y = k(y); z = k(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
function lab2rgb([L, a, bb]) {
  let y = (L + 16) / 116, x = a / 500 + y, z = y - bb / 200;
  const k = t => t ** 3 > 0.008856 ? t ** 3 : (t - 16 / 116) / 7.787;
  x = k(x) * 0.95047; y = k(y); z = k(z) * 1.08883;
  const g = c => 255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
  return [g(x * 3.2406 + y * -1.5372 + z * -0.4986), g(x * -0.9689 + y * 1.8758 + z * 0.0415), g(x * 0.0557 + y * -0.2040 + z * 1.0570)].map(v => clamp(v, 0, 255));
}
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
const luminance = rgb => { const [r, g, b] = rgb.map(c => (c /= 255) <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const inkFor = hex => luminance(fromHex(hex)) > 0.36 ? 'rgba(29,27,24,.86)' : 'rgba(255,255,255,.92)';

function rgb2hsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}

// A descriptive, paint-store-ish name from the colour itself.
const HUES = [[10, 'Red'], [20, 'Vermilion'], [32, 'Orange'], [42, 'Amber'], [52, 'Marigold'], [62, 'Yellow'], [75, 'Citron'], [95, 'Chartreuse'], [140, 'Green'], [165, 'Jade'], [185, 'Teal'], [200, 'Cyan'], [215, 'Sky'], [232, 'Azure'], [250, 'Blue'], [265, 'Indigo'], [280, 'Violet'], [300, 'Purple'], [320, 'Orchid'], [335, 'Magenta'], [350, 'Rose'], [361, 'Red']];
function nameColor(hex) {
  const rgb = fromHex(hex), [L, a, b] = rgb2lab(rgb), C = Math.hypot(a, b), [h, s, l] = rgb2hsl(rgb);
  const warm = h < 70 || h > 330;
  if (C < 7) {
    if (L > 94) return 'Chalk';
    if (L > 82) return warm && C > 2.5 ? 'Bone' : 'Fog';
    if (L > 68) return warm && C > 2.5 ? 'Oat' : 'Stone';
    if (L > 52) return warm && C > 2.5 ? 'Taupe' : 'Ash';
    if (L > 36) return warm && C > 2.5 ? 'Umber Grey' : 'Slate';
    if (L > 18) return 'Charcoal';
    return 'Ink';
  }
  let base = HUES.find(([lim]) => h < lim)[1], fixed = false;
  if (h >= 10 && h < 50 && l < 0.42) { base = C > 38 ? 'Rust' : l < 0.25 ? 'Cocoa' : 'Umber'; fixed = true; }
  else if (h >= 15 && h < 42 && l > 0.74) { base = 'Peach'; fixed = true; }
  else if (h >= 42 && h < 65 && l > 0.82) { base = 'Cream'; fixed = true; }
  else if (h >= 45 && h < 80 && l < 0.4) { base = 'Olive'; fixed = true; }
  else if ((h >= 335 || h < 10) && l > 0.74) { base = 'Pink'; fixed = true; }
  else if (h >= 20 && h < 50 && s < 0.35 && l < 0.75) { base = 'Sand'; fixed = true; }
  let mod = '';
  if (!fixed && l > 0.85) mod = 'Pale';
  else if (!fixed && l > 0.7) mod = 'Light';
  else if (!fixed && l < 0.2) mod = 'Deep';
  else if (!fixed && l < 0.33) mod = 'Dark';
  else if (s < 0.28) mod = 'Dusty';
  else if (s > 0.8 && l > 0.38 && l < 0.66) mod = 'Bright';
  return (mod ? mod + ' ' : '') + base;
}

// Small seeded RNG so "Shuffle" is repeatable per card.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Pull the colours that stand out, not just the most common ones:
// k-means in Lab, then pick clusters by size *and* vividness, keeping them distinct.
function extractPalette(img, n, seed) {
  const max = 140, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, pts = [];
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128) pts.push(rgb2lab([d[i], d[i + 1], d[i + 2]]));
  const rand = rng(seed), K = Math.min(pts.length, Math.max(14, n * 3));
  // k-means++ seeding
  const cents = [pts[Math.floor(rand() * pts.length)]], dd = new Float64Array(pts.length);
  while (cents.length < K) {
    let sum = 0;
    for (let i = 0; i < pts.length; i++) { let m = Infinity; for (const ct of cents) m = Math.min(m, dist(pts[i], ct)); dd[i] = m * m; sum += dd[i]; }
    let r = rand() * sum, i = 0; while ((r -= dd[i]) > 0 && i < pts.length - 1) i++;
    cents.push(pts[i].slice());
  }
  const lab = new Int16Array(pts.length);
  for (let it = 0; it < 10; it++) {
    const acc = cents.map(() => [0, 0, 0, 0]);
    for (let i = 0; i < pts.length; i++) {
      let best = 0, bd = Infinity;
      for (let k = 0; k < K; k++) { const dv = dist(pts[i], cents[k]); if (dv < bd) { bd = dv; best = k; } }
      lab[i] = best; const A = acc[best]; A[0] += pts[i][0]; A[1] += pts[i][1]; A[2] += pts[i][2]; A[3]++;
    }
    acc.forEach((A, k) => { if (A[3]) cents[k] = [A[0] / A[3], A[1] / A[3], A[2] / A[3]]; cents[k].n = A[3]; });
  }
  const clusters = cents.filter(ct => ct.n).map(ct => {
    const C = Math.hypot(ct[1], ct[2]);
    return { lab: ct, score: Math.pow(ct.n / pts.length, 0.55) * (0.45 + C / 55) * (0.85 + rand() * 0.3) };
  }).sort((a, b) => b.score - a.score);
  const picked = [];
  for (let minD = 16; picked.length < n && minD >= 0; minD -= 4)
    for (const cl of clusters) if (picked.length < n && !picked.includes(cl) && picked.every(p => dist(p.lab, cl.lab) >= minD)) picked.push(cl);
  const out = [];
  for (const p of picked.sort((a, b) => b.lab[0] - a.lab[0])) { const hex = toHex(lab2rgb(p.lab)); out.push({ hex, name: uniqueName(nameColor(hex), out) }); }
  return out;
}
// Two "Red"s on one card become "Red" and "Red II".
function uniqueName(name, colors) {
  const taken = new Set(colors.map(c => c.name));
  if (!taken.has(name)) return name;
  for (const r of ['II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX']) if (!taken.has(`${name} ${r}`)) return `${name} ${r}`;
  return name;
}

// ---------- card rendering (one renderer for preview, thumbs and export) ----------
const LAYOUTS = {
  portrait: { W: 1200, H: 1800 },
  landscape: { W: 1800, H: 1200 },
  chips: { W: 1200, H: 1500 },
};
const CARD_BG = '#fbfaf6', INK = '#1d1b18', MUTED = '#8b847a';
const SERIF = '"Instrument Serif", Georgia, serif', MONO = '"IBM Plex Mono", Menlo, monospace';

function geometry(card) {
  const { W, H } = LAYOUTS[card.layout], P = 60, n = card.colors.length;
  if (card.layout === 'portrait') {
    const photo = { x: P, y: P, w: W - 2 * P, h: 800 };
    const y0 = photo.y + photo.h + 26, y1 = H - P - 150;
    return { W, H, photo, bands: bandRects(P, y0, W - 2 * P, y1 - y0, n, 'v'), footer: { x: P, y: y1, w: W - 2 * P } };
  }
  if (card.layout === 'landscape') {
    const photo = { x: P, y: P, w: 1040, h: H - 2 * P }, x = photo.x + photo.w + 36, w = W - x - P;
    return { W, H, photo, bands: bandRects(x, P, w, H - 2 * P - 160, n, 'v'), footer: { x, y: H - P - 160, w } };
  }
  // chips: tall paint strip, no photo, tiny photo stamp in the corner of the footer
  const y1 = H - P - 170;
  return { W, H, photo: null, bands: bandRects(P, P, W - 2 * P, y1 - P, n, 'v'), footer: { x: P, y: y1, w: W - 2 * P }, stamp: { x: W - P - 130, y: y1 + 34, w: 130, h: 130 } };
}
function bandRects(x, y, w, h, n, dir) {
  const gap = 6, bh = (h - gap * (n - 1)) / Math.max(n, 1);
  return Array.from({ length: n }, (_, i) => ({ x, y: y + i * (bh + gap), w, h: bh }));
}
function coverRect(img, r) {
  const ir = img.naturalWidth / img.naturalHeight, rr = r.w / r.h;
  let sw = img.naturalWidth, sh = img.naturalHeight;
  if (ir > rr) sw = sh * rr; else sh = sw / rr;
  return { x: (img.naturalWidth - sw) / 2, y: (img.naturalHeight - sh) / 2, w: sw, h: sh };
}
function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}

function drawCard(ctx, card, { highlight = -1, hoverBand = -1 } = {}) {
  const g = geometry(card), { W, H } = g;
  ctx.save();
  ctx.fillStyle = CARD_BG; ctx.fillRect(0, 0, W, H);

  if (g.photo && card.img) {
    const s = coverRect(card.img, g.photo);
    ctx.drawImage(card.img, s.x, s.y, s.w, s.h, g.photo.x, g.photo.y, g.photo.w, g.photo.h);
  }

  g.bands.forEach((r, i) => {
    const col = card.colors[i];
    ctx.fillStyle = col.hex; ctx.fillRect(r.x, r.y, r.w, r.h);
    const ink = inkFor(col.hex), fs = clamp(r.h * 0.3, 18, 42), pad = 26;
    ctx.fillStyle = ink; ctx.textBaseline = 'middle';
    ctx.font = `400 ${fs * 1.15}px ${SERIF}`;
    ctx.textAlign = 'left';
    const hexText = col.hex.toUpperCase();
    ctx.save(); ctx.font = `500 ${fs * 0.74}px ${MONO}`; const hexW = ctx.measureText(hexText).width; ctx.restore();
    ctx.fillText(fitText(ctx, col.name || '', r.w - hexW - pad * 3), r.x + pad, r.y + r.h / 2 + 1);
    ctx.font = `500 ${fs * 0.74}px ${MONO}`; ctx.textAlign = 'right';
    ctx.fillText(hexText, r.x + r.w - pad, r.y + r.h / 2 + 1);
    if (i === highlight || i === hoverBand) {
      ctx.strokeStyle = ink; ctx.lineWidth = i === highlight ? 6 : 3;
      ctx.setLineDash(i === highlight ? [] : [10, 8]);
      ctx.strokeRect(r.x + 10, r.y + 10, r.w - 20, r.h - 20); ctx.setLineDash([]);
    }
  });

  // footer: name, date + count, card number
  const f = g.footer;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
  ctx.font = `400 74px ${SERIF}`;
  const titleMax = f.w - (g.stamp ? g.stamp.w + 30 : 0);
  ctx.fillText(fitText(ctx, card.title || 'Untitled', titleMax), f.x, f.y + 96);
  ctx.font = `400 22px ${MONO}`; ctx.fillStyle = MUTED;
  const meta = [card.dateLabel, `${card.colors.length} colours`].filter(Boolean).join('  ·  ').toUpperCase();
  ctx.fillText(meta, f.x, f.y + 140);
  if (!g.stamp) { ctx.textAlign = 'right'; ctx.fillText(`NO. ${String(card.no).padStart(3, '0')}`, f.x + f.w, f.y + 140); }
  if (g.stamp && card.img) {
    const st = g.stamp, s = coverRect(card.img, st);
    ctx.drawImage(card.img, s.x, s.y, s.w, s.h, st.x, st.y, st.w, st.h);
  }
  ctx.restore();
  return g;
}

// ---------- state & storage ----------
const $ = s => document.querySelector(s);
const canvas = $('#card'), ctx = canvas.getContext('2d');
let cards = [], cur = null, selected = -1, hoverBand = -1, geom = null;

const DB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('swatch-card', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('cards', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('cards', mode), q = fn(t.objectStore('cards')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    all: () => tx('readonly', s => s.getAll()).catch(() => []),
    put: c => tx('readwrite', s => s.put(c)).catch(() => {}),
    del: id => tx('readwrite', s => s.delete(id)).catch(() => {}),
  };
})();
const serialise = c => ({ id: c.id, no: c.no, title: c.title, dateLabel: c.dateLabel, layout: c.layout, colors: c.colors, seed: c.seed, blob: c.blob, created: c.created });
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); const c = cur; saveTimer = setTimeout(() => c && DB.put(serialise(c)), 300); };

function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// Pixel buffer of the photo for the eyedropper.
function sampler(card) {
  if (card._sample) return card._sample;
  const img = card.img, sc = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
  return card._sample = { w, h, sc, data: x.getImageData(0, 0, w, h).data };
}
function sampleAt(card, ix, iy) {
  const S = sampler(card), cx = Math.round(ix * S.sc), cy = Math.round(iy * S.sc);
  let r = 0, g = 0, b = 0, n = 0;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const x = clamp(cx + dx, 0, S.w - 1), y = clamp(cy + dy, 0, S.h - 1), i = (y * S.w + x) * 4;
    r += S.data[i]; g += S.data[i + 1]; b += S.data[i + 2]; n++;
  }
  return toHex([r / n, g / n, b / n]);
}

async function addFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  if (!imgs.length) return;
  let added = null, failed = 0;
  for (const f of imgs) {
    const url = URL.createObjectURL(f);
    let img;
    try { img = await loadImage(url); } catch { failed++; URL.revokeObjectURL(url); continue; }
    // Keep a reasonably sized copy so the shelf survives reloads without eating storage.
    const sc = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    const small = await loadImage(URL.createObjectURL(blob));
    const no = cards.reduce((m, k) => Math.max(m, k.no), 0) + 1;
    const d = new Date(f.lastModified || Date.now());
    const card = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      no, title: `Swatch No. ${no}`, created: Date.now(),
      dateLabel: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      layout: small.naturalWidth > small.naturalHeight * 1.15 ? 'landscape' : 'portrait',
      seed: 1, blob, img: small,
    };
    card.colors = extractPalette(small, 5, card.seed);
    cards.push(card); DB.put(serialise(card));
    added = card;
  }
  if (failed) toast(failed === 1 ? "Couldn't read one photo — HEIC only opens in Safari. Try a JPG or PNG." : `Couldn't read ${failed} photos (HEIC only opens in Safari).`);
  if (added) select(added);
  renderShelf();
}

// ---------- UI ----------
function select(card) {
  cur = card; selected = -1;
  $('#drop').hidden = !!card; $('main').hidden = !card; $('#shelf-wrap').hidden = !cards.length;
  if (!card) { renderShelf(); return; }
  $('#title').value = card.title;
  $('#count').value = card.colors.length; $('#countOut').textContent = card.colors.length;
  document.querySelectorAll('#layout button').forEach(b => b.classList.toggle('on', b.dataset.layout === card.layout));
  renderList(); draw(); renderShelf();
}

function draw() {
  if (!cur) return;
  const { W, H } = LAYOUTS[cur.layout];
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  geom = drawCard(ctx, cur, { highlight: selected, hoverBand });
  hint();
}

function hint() {
  const h = $('#hint');
  if (cur.layout === 'chips') h.innerHTML = 'Switch to <strong>Tall</strong> or <strong>Wide</strong> to pick colours straight from the photo.';
  else if (selected >= 0) h.innerHTML = `<strong>Click the photo</strong> to replace “${esc(cur.colors[selected].name)}”. Click the band again to cancel.`;
  else h.innerHTML = '<strong>Click the photo</strong> to add the colour under your cursor. Click a band to swap it for another spot.';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderList() {
  const ul = $('#colors'); ul.innerHTML = '';
  cur.colors.forEach((col, i) => {
    const li = document.createElement('li'); li.classList.toggle('sel', i === selected);
    li.innerHTML = `<button class="chip" title="Pick this one again from the photo" style="background:${col.hex}"></button>
      <input class="name" value="${esc(col.name)}" aria-label="Colour name" maxlength="28">
      <input class="hex" value="${col.hex.toUpperCase()}" aria-label="Hex code" maxlength="7" spellcheck="false">
      <button class="x" title="Remove">×</button>`;
    li.querySelector('.chip').onclick = () => toggleSelect(i);
    li.querySelector('.name').oninput = e => { col.name = e.target.value; draw(); saveSoon(); renderThumbSoon(); };
    li.querySelector('.hex').onchange = e => {
      const v = e.target.value.trim().replace(/^#?/, '#');
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) { setColor(i, toHex(fromHex(v))); } else e.target.value = col.hex.toUpperCase();
    };
    li.querySelector('.x').onclick = () => { if (cur.colors.length <= 1) return; cur.colors.splice(i, 1); selected = -1; afterColorsChange(); };
    ul.appendChild(li);
  });
}

function setColor(i, hex) {
  const col = cur.colors[i], autoNamed = !col.name || col.name.startsWith(nameColor(col.hex));
  col.hex = hex; if (autoNamed) col.name = uniqueName(nameColor(hex), cur.colors.filter(c => c !== col));
  afterColorsChange();
}
function afterColorsChange() {
  $('#count').value = cur.colors.length; $('#countOut').textContent = cur.colors.length;
  renderList(); draw(); saveSoon(); renderThumbSoon();
}
function toggleSelect(i) { selected = selected === i ? -1 : i; renderList(); draw(); }

// canvas interaction
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
}
const inside = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function photoToImage(p) {
  const s = coverRect(cur.img, geom.photo);
  return { x: s.x + (p.x - geom.photo.x) / geom.photo.w * s.w, y: s.y + (p.y - geom.photo.y) / geom.photo.h * s.h };
}
const loupe = $('#loupe');
canvas.addEventListener('pointermove', e => {
  if (!cur || !geom) return;
  const p = canvasPoint(e), onPhoto = inside(p, geom.photo), band = geom.bands.findIndex(r => inside(p, r));
  canvas.classList.toggle('over-photo', onPhoto); canvas.classList.toggle('over-band', band >= 0);
  if (onPhoto && e.pointerType !== 'touch') {
    const q = photoToImage(p), hex = sampleAt(cur, q.x, q.y);
    loupe.style.display = 'block'; loupe.style.left = e.clientX + 'px'; loupe.style.top = e.clientY + 'px';
    loupe.style.background = hex; loupe.firstChild.textContent = hex.toUpperCase();
  } else loupe.style.display = 'none';
  if (band !== hoverBand) { hoverBand = band; draw(); }
});
canvas.addEventListener('pointerleave', () => { loupe.style.display = 'none'; if (hoverBand !== -1) { hoverBand = -1; draw(); } });
canvas.addEventListener('click', e => {
  if (!cur || !geom) return;
  const p = canvasPoint(e);
  if (inside(p, geom.photo)) {
    const q = photoToImage(p), hex = sampleAt(cur, q.x, q.y);
    if (selected >= 0) { const i = selected; selected = -1; setColor(i, hex); toast(`Swapped in ${hex.toUpperCase()}`); }
    else if (cur.colors.length >= 9) toast('Nine is the most a card holds. Click a band first to swap one out.');
    else {
      const name = uniqueName(nameColor(hex), cur.colors);
      cur.colors.push({ hex, name });
      afterColorsChange(); toast(`Added ${name}`);
    }
    return;
  }
  const band = geom.bands.findIndex(r => inside(p, r));
  if (band >= 0) {
    if (cur.layout === 'chips') { copy(cur.colors[band].hex); return; }
    toggleSelect(band);
  }
});

function copy(hex) { navigator.clipboard?.writeText(hex.toUpperCase()).then(() => toast(`Copied ${hex.toUpperCase()}`), () => {}); }

$('#title').addEventListener('input', e => { cur.title = e.target.value; draw(); saveSoon(); renderThumbSoon(); });
document.querySelectorAll('#layout button').forEach(b => b.onclick = () => { cur.layout = b.dataset.layout; selected = -1; hoverBand = -1; select(cur); saveSoon(); });
$('#count').addEventListener('input', e => {
  $('#countOut').textContent = e.target.value;
  cur.colors = extractPalette(cur.img, +e.target.value, cur.seed); selected = -1;
  renderList(); draw(); saveSoon(); renderThumbSoon();
});
$('#shuffle').onclick = () => {
  cur.seed = (cur.seed || 1) + 1;
  cur.colors = extractPalette(cur.img, cur.colors.length, cur.seed); selected = -1;
  renderList(); draw(); saveSoon(); renderThumbSoon();
};
$('#download').onclick = () => {
  const { W, H } = LAYOUTS[cur.layout], c = document.createElement('canvas'); c.width = W; c.height = H;
  drawCard(c.getContext('2d'), cur);
  c.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = (cur.title || 'swatch-card').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-').toLowerCase() + '.png';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};

// shelf
let thumbTimer;
const renderThumbSoon = () => { clearTimeout(thumbTimer); thumbTimer = setTimeout(renderShelf, 250); };
function renderShelf() {
  const shelf = $('#shelf'); shelf.innerHTML = '';
  $('#shelf-wrap').hidden = !cards.length;
  for (const card of cards) {
    const { W, H } = LAYOUTS[card.layout], k = 300 / H;
    const btn = document.createElement('div'); btn.className = 'thumb' + (card === cur ? ' on' : '');
    btn.tabIndex = 0; btn.setAttribute('role', 'button'); btn.title = card.title;
    const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = 300;
    const x = c.getContext('2d'); x.scale(k, k); drawCard(x, card);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = 'Delete card';
    del.onclick = ev => {
      ev.stopPropagation();
      if (!confirm(`Delete “${card.title}”?`)) return;
      cards = cards.filter(k => k !== card); DB.del(card.id);
      select(card === cur ? cards[cards.length - 1] || null : cur);
    };
    btn.onclick = () => select(card);
    btn.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(card); } };
    btn.append(c, del); shelf.appendChild(btn);
  }
  const add = document.createElement('button'); add.className = 'add-thumb'; add.textContent = '+ Add photos';
  add.onclick = () => $('#file').click(); shelf.appendChild(add);
}

// uploads: picker, drag and drop, paste
const fileInput = $('#file');
document.querySelectorAll('[data-upload]').forEach(b => b.onclick = () => fileInput.click());
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); addFiles(e.dataTransfer.files); });
addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) addFiles(fs); });
addEventListener('keydown', e => { if (e.key === 'Escape' && selected >= 0) toggleSelect(selected); });

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

// boot: wait for fonts so canvas text uses them, then restore saved cards
(async () => {
  try { await Promise.all([document.fonts.load(`74px ${SERIF}`), document.fonts.load(`22px ${MONO}`), document.fonts.load(`500 22px ${MONO}`)]); } catch {}
  const saved = (await DB.all()).sort((a, b) => a.created - b.created);
  for (const s of saved) {
    try { cards.push({ ...s, img: await loadImage(URL.createObjectURL(s.blob)) }); } catch {}
  }
  if (cards.length) select(cards[cards.length - 1]); else renderShelf();
  document.fonts.ready.then(() => cur && (draw(), renderShelf()));
})();
</script>
</body>
</html>
