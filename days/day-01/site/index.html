<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cig Count">
  <meta name="theme-color" content="#16120f">
  <title>Cigarette Counter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316120f'/><rect x='14' y='44' width='56' height='12' rx='2' fill='%23f4efe8'/><rect x='70' y='44' width='16' height='12' rx='2' fill='%23ff8a3d'/></svg>">
  <style>
    :root {
      --bg: #f6f1ea;
      --surface: #fffaf4;
      --ink: #1f1a16;
      --muted: #8a7f74;
      --line: #e6ddd2;
      --ember: #ff6a1f;
      --ember-soft: #ffe6d6;
      --good: #2f9e6b;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16120f;
        --surface: #211c18;
        --ink: #f4efe8;
        --muted: #9c9187;
        --line: #332c26;
        --ember: #ff8a3d;
        --ember-soft: #3a2416;
        --good: #4cc38a;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; color: var(--ink); background: var(--bg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    main { max-width: 460px; margin: 0 auto; padding: 16px 16px 48px; }
    button { font: inherit; color: inherit; cursor: pointer; }

    .top { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 4px; }
    .date { font: 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .link { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 2px; }
    .link:hover { color: var(--ink); }

    .counter { text-align: center; padding: 18px 0 8px; }
    .count { font-size: clamp(96px, 34vw, 150px); font-weight: 800; line-height: 1; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
    .count.bump { animation: bump .25s ease-out; }
    @keyframes bump { 40% { transform: scale(1.08); } }
    .label { color: var(--muted); margin-top: 6px; }
    .meter { height: 8px; border-radius: 99px; background: var(--line); margin: 14px auto 0; max-width: 260px; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .3s, background .3s; }
    .meter.near i { background: var(--ember); }
    .meter.over i { background: #d23c3c; }

    .add {
      display: block; width: 168px; height: 168px; margin: 28px auto 14px; border-radius: 50%;
      border: 0; background: var(--ember); color: #fff; font-size: 44px; font-weight: 800;
      box-shadow: 0 10px 30px color-mix(in srgb, var(--ember) 40%, transparent), inset 0 -6px 0 rgb(0 0 0 / .12);
      transition: transform .08s;
      touch-action: manipulation;
    }
    .add:active { transform: scale(.95); }
    .add small { display: block; font-size: 13px; font-weight: 600; opacity: .85; letter-spacing: .04em; }
    .undo { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
    .undo:disabled { opacity: .35; cursor: default; }
    .since { color: var(--muted); font-size: 15px; margin: 18px 0 0; min-height: 1.4em; }
    .since b { color: var(--ink); font-variant-numeric: tabular-nums; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 16px; }
    .card h2 { margin: 0 0 12px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .card h2 button { font: 13px -apple-system, sans-serif; text-transform: none; letter-spacing: 0; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat b { display: block; font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .stat span { font-size: 12px; color: var(--muted); }

    .chart { width: 100%; height: auto; display: block; }
    .chart .bar { fill: var(--line); }
    .chart .bar.has { fill: color-mix(in srgb, var(--ember) 55%, var(--line)); }
    .chart .bar.today { fill: var(--ember); }
    .chart text { fill: var(--muted); font: 10px var(--mono); }
    .chart .num { fill: var(--ink); font-weight: 600; }
    .chart .limit { stroke: var(--good); stroke-dasharray: 4 4; stroke-width: 1.5; }

    .times { list-style: none; margin: 0; padding: 0; }
    .times li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .times li:first-child { border-top: 0; }
    .times .t { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 76px; }
    .times .gap { color: var(--muted); font-size: 13px; flex: 1; }
    .times button { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 2px 8px; border-radius: 8px; }
    .times button:hover { color: #d23c3c; background: var(--bg); }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }
    .manual { display: flex; gap: 8px; margin-top: 12px; }
    .manual[hidden], .meter[hidden] { display: none; }
    .manual input { flex: 1; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: 14px; }
    .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn.danger { color: #d23c3c; }

    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
    footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; }

    dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 20px; width: min(360px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgb(0 0 0 / .45); }
    dialog h3 { margin: 0 0 6px; }
    dialog p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
    dialog label { display: block; font-size: 14px; margin-bottom: 6px; }
    dialog input { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    dialog .row { display: flex; gap: 8px; justify-content: space-between; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <span class="date" id="date"></span>
      <button class="link" id="openSettings">Daily limit</button>
    </div>

    <section class="counter">
      <div class="count" id="count">0</div>
      <div class="label" id="label">today</div>
      <div class="meter" id="meter" hidden><i></i></div>
      <button class="add" id="add" aria-label="Log a cigarette">+1<small>LOG ONE</small></button>
      <button class="undo" id="undo">Undo last</button>
      <p class="since" id="since"></p>
    </section>

    <section class="card">
      <h2>So far</h2>
      <div class="stats">
        <div class="stat"><b id="sYesterday">–</b><span>yesterday</span></div>
        <div class="stat"><b id="sSameTime">–</b><span>by this time yesterday</span></div>
        <div class="stat"><b id="sAvg">–</b><span>7-day average</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Last 14 days</h2>
      <svg class="chart" id="chart" viewBox="0 0 340 130" role="img" aria-label="Cigarettes per day, last 14 days"></svg>
    </section>

    <section class="card">
      <h2>Today <button class="link" id="toggleManual">+ add one I forgot</button></h2>
      <ol class="times" id="times"></ol>
      <form class="manual" id="manual" hidden>
        <input type="time" id="manualTime" required aria-label="Time">
        <button class="btn primary">Add</button>
      </form>
    </section>

    <footer>
      Saved privately on this device only.<br>
      <button id="export">Export CSV</button>
    </footer>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h3>Daily limit</h3>
      <p>Optional. Set a number you're aiming to stay at or under. Leave blank for no limit.</p>
      <label for="limitInput">Cigarettes per day</label>
      <input type="number" id="limitInput" min="1" max="99" inputmode="numeric" placeholder="No limit">
      <div class="row">
        <button class="btn danger" type="button" id="clearAll">Erase all data</button>
        <span>
          <button class="btn" value="cancel" formnovalidate>Cancel</button>
          <button class="btn primary" value="save">Save</button>
        </span>
      </div>
    </form>
  </dialog>

  <script>
    const KEY = "cigcounter.v1";
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && Array.isArray(s.log)) return { log: s.log.filter(Number.isFinite), limit: s.limit || null };
      } catch (e) {}
      return { log: [], limit: null };
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    let state = load();

    const dayKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
    const daysAgo = (n) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; };
    const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    function fmtDur(ms) {
      const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
      if (d > 0) return `${d}d ${h % 24}h`;
      if (h > 0) return `${h}h ${pad(m % 60)}m`;
      return `${m}m`;
    }

    function counts() {
      const c = new Map();
      for (const t of state.log) c.set(dayKey(t), (c.get(dayKey(t)) || 0) + 1);
      return c;
    }

    function render() {
      const now = Date.now(), today = dayKey(now), c = counts();
      const todays = state.log.filter((t) => dayKey(t) === today).sort((a, b) => a - b);
      const n = todays.length, limit = state.limit;

      $("date").textContent = new Date().toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
      $("count").textContent = n;
      $("label").textContent = limit ? `of ${limit} today${n > limit ? ` · ${n - limit} over` : n === limit ? " · at your limit" : ` · ${limit - n} left`}` : n === 1 ? "cigarette today" : "cigarettes today";
      const meter = $("meter");
      meter.hidden = !limit;
      if (limit) {
        meter.querySelector("i").style.width = Math.min(100, (n / limit) * 100) + "%";
        meter.className = "meter" + (n > limit ? " over" : n >= limit * 0.75 ? " near" : "");
      }
      $("undo").disabled = n === 0;

      const last = state.log.length ? Math.max(...state.log) : null;
      $("since").innerHTML = last ? `Last one <b>${fmtDur(now - last)}</b> ago` : "Tap +1 each time you smoke.";

      // stats
      const y = c.get(dayKey(daysAgo(1))) || 0;
      const yStart = new Date(daysAgo(1)); yStart.setHours(0, 0, 0, 0);
      const sameTime = new Date(now); sameTime.setDate(sameTime.getDate() - 1);
      const ySame = state.log.filter((t) => t >= yStart.getTime() && t <= sameTime.getTime()).length;
      const tracked = state.log.length ? Math.min(...state.log) : now;
      let sum = 0, days = 0;
      for (let i = 1; i <= 7; i++) { const d = daysAgo(i); if (dayKey(d) >= dayKey(tracked)) { sum += c.get(dayKey(d)) || 0; days++; } }
      $("sYesterday").textContent = state.log.length && dayKey(tracked) <= dayKey(daysAgo(1)) ? y : "–";
      $("sSameTime").textContent = state.log.length && dayKey(tracked) <= dayKey(daysAgo(1)) ? ySame : "–";
      $("sAvg").textContent = days ? (sum / days).toFixed(1).replace(/\.0$/, "") : "–";

      renderChart(c);

      // today's list, newest first
      $("times").innerHTML = n ? todays.map((t, i) => `<li><span class="t">${fmtTime(t)}</span><span class="gap">${i > 0 ? "+" + fmtDur(t - todays[i - 1]) + " after previous" : "first of the day"}</span><button data-t="${t}" aria-label="Remove ${fmtTime(t)}">×</button></li>`).reverse().join("")
        : `<li><p class="empty">Nothing logged yet today.</p></li>`;
    }

    function renderChart(c) {
      const W = 340, H = 130, top = 16, bottom = 20, gap = 4, N = 14;
      const bw = (W - gap * (N - 1)) / N;
      const vals = [];
      for (let i = N - 1; i >= 0; i--) { const d = daysAgo(i); vals.push({ d, v: c.get(dayKey(d)) || 0, today: i === 0 }); }
      const max = Math.max(1, state.limit || 0, ...vals.map((x) => x.v));
      const h = (v) => (v / max) * (H - top - bottom);
      let s = "";
      vals.forEach((x, i) => {
        const bx = i * (bw + gap), bh = Math.max(2, h(x.v)), by = H - bottom - bh;
        s += `<rect class="bar ${x.v ? "has" : ""} ${x.today ? "today" : ""}" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3"><title>${x.d.toLocaleDateString([], { month: "short", day: "numeric" })}: ${x.v}</title></rect>`;
        if (x.v) s += `<text class="num" x="${bx + bw / 2}" y="${by - 4}" text-anchor="middle">${x.v}</text>`;
        s += `<text x="${bx + bw / 2}" y="${H - 5}" text-anchor="middle">${x.today ? "•" : x.d.toLocaleDateString([], { weekday: "narrow" })}</text>`;
      });
      if (state.limit) { const ly = H - bottom - h(state.limit); s += `<line class="limit" x1="0" x2="${W}" y1="${ly}" y2="${ly}"/>`; }
      $("chart").innerHTML = s;
    }

    function bump() { const el = $("count"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

    $("add").addEventListener("click", () => {
      state.log.push(Date.now()); save(); render(); bump();
      if (navigator.vibrate) navigator.vibrate(15);
    });
    $("undo").addEventListener("click", () => {
      const today = dayKey(Date.now());
      const todays = state.log.filter((t) => dayKey(t) === today);
      if (!todays.length) return;
      const lastT = Math.max(...todays);
      state.log.splice(state.log.indexOf(lastT), 1); save(); render();
    });
    $("times").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-t]"); if (!b) return;
      const i = state.log.indexOf(+b.dataset.t);
      if (i >= 0) { state.log.splice(i, 1); save(); render(); }
    });

    $("toggleManual").addEventListener("click", () => {
      const f = $("manual"); f.hidden = !f.hidden;
      if (!f.hidden) { const d = new Date(); $("manualTime").value = `${pad(d.getHours())}:${pad(d.getMinutes())}`; $("manualTime").focus(); }
    });
    $("manual").addEventListener("submit", (e) => {
      e.preventDefault();
      const [hh, mm] = $("manualTime").value.split(":").map(Number);
      const d = new Date(); d.setHours(hh, mm, 0, 0);
      if (d.getTime() > Date.now()) return alert("That time hasn't happened yet today.");
      state.log.push(d.getTime()); save(); render();
      $("manual").hidden = true;
    });

    const dlg = $("settings");
    $("openSettings").addEventListener("click", () => { $("limitInput").value = state.limit || ""; dlg.showModal(); });
    dlg.addEventListener("close", () => {
      if (dlg.returnValue !== "save") return;
      const v = parseInt($("limitInput").value, 10);
      state.limit = v > 0 ? v : null; save(); render();
    });
    $("clearAll").addEventListener("click", () => {
      if (!confirm("Erase every logged cigarette and your limit? This can't be undone.")) return;
      state = { log: [], limit: null }; save(); dlg.close(); render();
    });

    $("export").addEventListener("click", () => {
      const rows = ["date,time,timestamp"].concat(state.log.slice().sort((a, b) => a - b).map((t) => `${dayKey(t)},${fmtTime(t)},${new Date(t).toISOString()}`));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" }));
      a.download = `cigarettes-${dayKey(Date.now())}.csv`;
      a.click();
    });

    render();
    setInterval(render, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  </script>
</body>
</html>
